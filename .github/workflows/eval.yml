name: Evaluate on Groq

# Runs the evaluation questions through Groq's free tier, grades them, and commits the
# results, the response cache and the daily request ledger back to the repo.
#
# Runs are resumable: finished questions are skipped, so when a daily quota runs out the
# run stops cleanly; dispatch it again the next day to continue.
#
# One-time setup:
#   - repository variable SEC_CONTACT (your email), used to rebuild the facts database
#   - repository SECRET GROQ_API_KEY (from console.groq.com/keys)

# A nightly run (shortly after Groq's daily quota resets at 00:00 UTC) continues any unfinished
# evaluation and does nothing once everything is answered.

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
    inputs:
      system:
        description: "Which system to evaluate"
        type: choice
        options: [facts_agent, full_agent, closed_book]
        default: facts_agent
      max_requests:
        description: "Max Groq requests this run (free-tier daily limits apply)"
        default: "400"
      redo_tiers:
        description: "Archive and re-run whole tiers, e.g. 3 (empty = none)"
        required: false
        default: ""
      question_set:
        description: "main (tuned on) or heldout (never used for tuning; generated once with a different seed)"
        type: choice
        options: [main, heldout]
        default: main
      redo_ids:
        description: "Archive and re-run these question ids (comma separated)"
        required: false
        default: ""
      redo_refusals:
        description: "Re-run only the answerable questions that were wrongly declined"
        type: boolean
        default: false
      tiers:
        description: "Tiers to run, e.g. 0,1,2,3 (empty = all)"
        required: false
        default: ""
      models:
        description: "Comma-separated Groq models, preferred first (empty = defaults)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SEC_USER_AGENT: edgar-analyst ${{ vars.SEC_CONTACT }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check setup
        run: |
          [ -n "${{ vars.SEC_CONTACT }}" ] || { echo "::error::Set the SEC_CONTACT repository variable."; exit 1; }
          [ -n "$GROQ_API_KEY" ] || { echo "::error::Add the GROQ_API_KEY repository secret."; exit 1; }
      - run: pip install -e .
      - name: Anything left to do?
        id: pending
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "n=$(python -m edgar_analyst pending)" >> "$GITHUB_OUTPUT"
          else
            echo "n=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild facts database
        if: steps.pending.outputs.n != '0'
        run: |
          python -m edgar_analyst ingest
          python -m edgar_analyst build-db
      - name: Held-out questions (generated once, then committed)
        if: inputs.question_set == 'heldout'
        run: |
          [ -f evals/heldout_questions.jsonl ] || python -m edgar_analyst gen-questions --seed 11 \
            --out evals/heldout_questions.jsonl --exclude evals/questions.jsonl --sizes 25,40,40,10
      - name: Build text index (full_agent only)
        if: steps.pending.outputs.n != '0' && (inputs.system == 'full_agent' || github.event_name == 'schedule')
        run: |
          pip install fastembed
          python -m edgar_analyst ingest-text
      - name: Run evaluation
        if: steps.pending.outputs.n != '0'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m edgar_analyst run-eval --system full_agent --max-requests 900
            python -m edgar_analyst run-eval --system facts_agent --max-requests 900
            exit 0
          fi
          args="--system ${{ inputs.system }} --max-requests ${{ inputs.max_requests }} --set ${{ inputs.question_set || 'main' }}"
          [ -z "${{ inputs.redo_tiers }}" ] || args="$args --redo-tiers ${{ inputs.redo_tiers }}"
          [ -z "${{ inputs.redo_ids }}" ] || args="$args --redo-ids ${{ inputs.redo_ids }}"
          [ "${{ inputs.redo_refusals }}" != "true" ] || args="$args --redo-refusals"
          [ -z "${{ inputs.tiers }}" ] || args="$args --tiers ${{ inputs.tiers }}"
          [ -z "${{ inputs.models }}" ] || args="$args --models ${{ inputs.models }}"
          python -m edgar_analyst run-eval $args
      - name: Report
        if: always() && steps.pending.outputs.n != '0'
        run: python -m edgar_analyst report --set ${{ inputs.question_set || 'main' }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: always() && steps.pending.outputs.n != '0'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add evals/results evals/llm_cache evals/groq_ledger.json evals/heldout_questions.jsonl
          git diff --cached --quiet || git commit -m "Evaluation results"
          git pull --rebase -X theirs && git push
