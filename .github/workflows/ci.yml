name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Compile check
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Evaluation quality gate (committed results)
        # Checks the stored evaluation results, so it costs no API calls. It fails the build if the
        # recorded accuracy or refusal rate of the facts agent drops below the thresholds.
        run: PYTHONPATH=src python -m edgar_analyst report --gate-system facts_agent --min-accuracy 85 --min-refusal 95
