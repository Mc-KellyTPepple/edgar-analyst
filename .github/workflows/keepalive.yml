name: keepalive
# Pings the free Render service so it does not fall asleep (Render sleeps free services after 15 idle minutes).
# One always-on free web service is about 744 h/month, inside Render's 750 free hours. /health uses no Groq quota.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 10 --max-time 60 https://edgar-analyst.onrender.com/health
